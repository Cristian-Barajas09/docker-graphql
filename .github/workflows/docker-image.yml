name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Generate Semantic Version
      uses: paulhatch/semantic-version@v4.0.2
      with:
        major_pattern: /^major(\(.+\))?:.+/
        minor_pattern: /^feat(\(.+\))?:.+/
        format: "${major}.${minor}.${patch}-prerelease${increment}"
      id: version

    - name: Authenticate in docker hub
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      run: |
        docker login -u $DOCKER_USER -p $DOCKER_PASSWORD

    - name: Build docker image
      env:
        NEW_VERSION: ${{ steps.version.outputs.version }}
      run: |
        docker build -t cristianb19/docker-graphql:$NEW_VERSION .
        docker build -t cristianb19/docker-graphql:latest .


    - name: Push Docker image
      env:
        NEW_VERSION: ${{ steps.version.outputs.version }}
      run: |
        docker push cristianb19/docker-graphql:$NEW_VERSION
        docker push -t cristianb19/docker-graphql:latest



    # - name: Build the Docker image
